version: '3.8'

services:
  user-db:
    image: postgres:13-alpine
    container_name: user-db
    environment:
      POSTGRES_USER: user_service
      POSTGRES_PASSWORD: user_password
      POSTGRES_DB: users_db
    volumes:
      - user-db-data:/var/lib/postgresql/data
    networks:
      - app-network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_service -d users_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    build: ./user_service
    container_name: user-service
    environment:
      DATABASE_URL: postgresql://user_service:user_password@user-db:5432/users_db
      PRIVATE_KEY_PATH: /app/private_key.pem
      PUBLIC_KEY_PATH: /app/public_key.pem
    depends_on:
      user-db:
        condition: service_healthy
    networks:
      - app-network
    ports:
      - "5001:5001"
    volumes:
      - ./user_service/private_key.pem:/app/private_key.pem
      - ./user_service/public_key.pem:/app/public_key.pem

  api-gateway:
    build: ./gateway
    container_name: api-gateway
    depends_on:
      user-service:
        condition: service_started
    networks:
      - app-network
    ports:
      - "5000:5000"
    volumes:
      - ./user_service/public_key.pem:/app/public_key.pem
    command: ["./wait-for-it.sh", "user-service:5001", "--", "python", "api_gateway.py"]

volumes:
  user-db-data:

networks:
  app-network:
    driver: bridge